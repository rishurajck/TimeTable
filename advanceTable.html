<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advance HTML Table in Hindi</title>
    <style>
      table,
      th,
      td {
        border: 1px solid grey;
        border-collapse: collapse;
        text-align: center;
        padding: 10px;
      }
      h2 {
        text-align: center;
      }

      .color {
        margin-left: auto;
        margin-right: auto;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <h2>Advance HTML Table in TimeTable</h2>
    <table class="color">
      <tr>
        <td rowspan="3"><strong>Day</strong></td>
        <td colspan="3"><strong>Seminar</strong></td>
      </tr>
      <tr>
        <td colspan="2"><strong>Schedule</strong></td>
        <td rowspan="2"><strong>Topic</strong></td>
      </tr>
      <tr>
        <td><strong>Start</strong></td>
        <td><strong>End</strong></td>
      </tr>
      <tr>
        <td rowspan="2">Monday</td>
        <td rowspan="2">08:00 AM</td>
        <td rowspan="2">05:00 PM</td>
        <td>Introduction</td>
      </tr>
      <tr>
        <td>Uses</td>
      </tr>
      <tr>
        <td rowspan="4">Tuesday</td>
        <td>08:00 AM</td>
        <td>11:00 PM</td>
        <td>--</td>
      </tr>
      <tr>
        <td>11:00 AM</td>
        <td>02:00 PM</td>
        <td>Learn</td>
      </tr>
      <tr>
        <td>02:00 PM</td>
        <td>08:00 PM</td>
        <td rowspan="2">--</td>
      </tr>
      <tr>
        <td>10:00 AM</td>
        <td>01:00 PM</td>
      </tr>
      <tr>
        <td>Wed-Fri</td>
        <td colspan="2">Full Day</td>
        <td>Practical</td>
      </tr>
      <tr>
        <td>Sat-Sun</td>
        <td colspan="2">11:00 AM - 05:00 PM</td>
        <td>Extra Class</td>
      </tr>
    </table>
  </body>
</html>
